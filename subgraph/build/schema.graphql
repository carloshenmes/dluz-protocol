type Retirement @entity(immutable: true) {
  id: Bytes!
  user: Bytes!
  amount: BigInt!
  reason: String!
  dluzReward: BigInt!
  denergyMinted: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type UserStats @entity(immutable: false) {
  id: Bytes!
  totalRetired: BigInt!
  totalDluzEarned: BigInt!
  totalDenergyEarned: BigInt!
  retirementCount: BigInt!
}

type ProtocolStats @entity(immutable: false) {
  id: Bytes!
  totalCarbonRetired: BigInt!
  totalDluzDistributed: BigInt!
  totalDenergyMinted: BigInt!
  totalRetirements: BigInt!
}
